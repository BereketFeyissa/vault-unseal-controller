apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-unseal-controller
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-unseal-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-unseal-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-unseal-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: vault-unseal-controller
      imagePullSecrets:
        - name: regcred
      containers:
        - name: controller
          image: ghcr.io/bereketfeyissa/vault-unseal-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --namespace=vault
            - --secret-name=vault-unseal-keys
            - --secret-key=unseal-keys
            - --threshold=3
            - --protocol=http
            - --poll-interval=30s
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
