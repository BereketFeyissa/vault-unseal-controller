apiVersion: v1
kind: Secret
metadata:
  name: vault-unseal-keys
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-unseal-controller
type: Opaque
stringData:
  # Paste your unseal keys below, one per line.
  # These are the Shamir unseal keys from `vault operator init`.
  # Example (DO NOT use these real keys):
  #   unseal-keys: |
  #     ABC123...
  #     DEF456...
  #     GHI789...
  unseal-keys: |
    REPLACE_WITH_UNSEAL_KEY_1
    REPLACE_WITH_UNSEAL_KEY_2
    REPLACE_WITH_UNSEAL_KEY_3
