apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-unseal-controller
type: kubernetes.io/dockerconfigjson
data:
  # Base64-encoded Docker registry credentials.
  # Create with: 
  #   kubectl create secret docker-registry regcred \
  #   --namespace=vault \
  #   --docker-server=YOUR_REGISTRY \
  #   --docker-username=YOUR_USERNAME \
  #   --docker-password=YOUR_PASSWORD --dry-run=client -o yaml
  #
  # Or manually paste the output of:
  #   cat ~/.docker/config.json | base64 -w0
  .dockerconfigjson: REPLACE_WITH_BASE64_ENCODED_DOCKER_CONFIG
